plugins {
    id 'com.android.application'
}

android {
    namespace 'eu.davidjaeger.minimal'
    compileSdk 34

    defaultConfig {
        applicationId "eu.davidjaeger.minimal"
        minSdk 21
        targetSdk 28
        versionCode 7
        versionName "1.6"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
